name: Verify IC-705 session stability regressions

on:
  push:
    branches:
      - fix/ic705-session-stability

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ic705-session-stability
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Finish recovery integration patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          session = Path('src/ic705/session/Ic705RxSession.kt')
          text = session.read_text()

          old = "\n".join([
              "            if (",
              "                runtime.role == Ic705ChannelRole.AUDIO &&",
              "                (pttPossiblyAsserted || now < audioWatchdogGraceUntilMillis)",
              "            ) {",
              "                return@firstOrNull false",
              "            }",
          ])
          new = "\n".join([
              "            if (",
              "                runtime.role == Ic705ChannelRole.AUDIO &&",
              "                shouldSuppressIc705AudioWatchdog(",
              "                    pttPossiblyAsserted = pttPossiblyAsserted,",
              "                    nowMillis = now,",
              "                    graceUntilMillis = audioWatchdogGraceUntilMillis,",
              "                )",
              "            ) {",
              "                return@firstOrNull false",
              "            }",
          ])
          if text.count(old) != 1:
              raise SystemExit('audio watchdog suppression block mismatch')
          text = text.replace(old, new, 1)

          old = "\n".join([
              "        } catch (_: Ic705ProtocolException) {",
              "            reportIssue(",
              "                Ic705RxSessionIssueCode.MALFORMED_PACKET,",
              "                role,",
              "                packetDiagnostic(datagram.data, runtime.localId),",
              "            )",
              "        } catch (_: IllegalArgumentException) {",
          ])
          new = "\n".join([
              "        } catch (_: IOException) {",
              "            reportIssue(Ic705RxSessionIssueCode.SOCKET_IO, role)",
              "            dispatch(Ic705RxSessionEngine.Event.RecoverableFailure(\"$role socket I/O\"))",
              "        } catch (_: Ic705ProtocolException) {",
              "            reportIssue(",
              "                Ic705RxSessionIssueCode.MALFORMED_PACKET,",
              "                role,",
              "                packetDiagnostic(datagram.data, runtime.localId),",
              "            )",
              "        } catch (_: IllegalArgumentException) {",
          ])
          if text.count(old) != 1:
              raise SystemExit('handleDatagram catch block mismatch')
          text = text.replace(old, new, 1)

          marker = "\n".join([
              "internal fun ic705ChannelWatchdogTimeoutMillis(",
              "    timing: Ic705RxSessionTiming,",
              "    role: Ic705ChannelRole,",
              "): Long = when (role) {",
              "    Ic705ChannelRole.CONTROL -> timing.channelTimeoutMillis",
              "    Ic705ChannelRole.CIV -> timing.civChannelTimeoutMillis",
              "    Ic705ChannelRole.AUDIO -> timing.audioChannelTimeoutMillis",
              "}",
              "",
              "private fun namedDaemonThreadFactory",
          ])
          replacement = "\n".join([
              "internal fun ic705ChannelWatchdogTimeoutMillis(",
              "    timing: Ic705RxSessionTiming,",
              "    role: Ic705ChannelRole,",
              "): Long = when (role) {",
              "    Ic705ChannelRole.CONTROL -> timing.channelTimeoutMillis",
              "    Ic705ChannelRole.CIV -> timing.civChannelTimeoutMillis",
              "    Ic705ChannelRole.AUDIO -> timing.audioChannelTimeoutMillis",
              "}",
              "",
              "internal fun shouldSuppressIc705AudioWatchdog(",
              "    pttPossiblyAsserted: Boolean,",
              "    nowMillis: Long,",
              "    graceUntilMillis: Long,",
              "): Boolean = pttPossiblyAsserted || nowMillis < graceUntilMillis",
              "",
              "private fun namedDaemonThreadFactory",
          ])
          if text.count(marker) != 1:
              raise SystemExit('watchdog helper insertion point mismatch')
          text = text.replace(marker, replacement, 1)
          session.write_text(text)

          udp_test = Path('test/java/org/aprsdroid/app/ic705/transport/Ic705UdpChannelTest.kt')
          test_text = udp_test.read_text()
          if 'import org.junit.Assert.assertNull' not in test_text:
              test_text = test_text.replace(
                  'import org.junit.Assert.assertFalse\n',
                  'import org.junit.Assert.assertFalse\nimport org.junit.Assert.assertNull\n',
                  1,
              )
          test_text = test_text.replace(
              '        assertEquals(null, sendFailure.get())\n',
              '        assertNull(sendFailure.get())\n',
              1,
          )
          udp_test.write_text(test_text)
          PY

      - name: Remove one-off workflow
        run: rm .github/workflows/ic705-session-stability-verify.yml

      - name: Run unit tests and lint
        run: ./gradlew testArm64OpenglDebugUnitTest lintArm64OpenglDebug --no-daemon --stacktrace

      - name: Commit verified integration patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ic705/session/Ic705RxSession.kt test/java/org/aprsdroid/app/ic705/transport/Ic705UdpChannelTest.kt .github/workflows/ic705-session-stability-verify.yml
          git commit -m 'fix: integrate IC-705 watchdog recovery guards'
          git push origin HEAD:fix/ic705-session-stability
