name: Finalize Mod-v1.9.4 Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize_mod_v1_9_4.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Restore normal release workflow and remove bootstrap marker
        shell: bash
        run: |
          set -euo pipefail
          git checkout ca3427d934ef331574c10d597528e42cff5f5a3a -- \
            .github/workflows/release.yml \
            .github/scripts/extract_release_notes.py
          rm -f .github/.prepare_mod_v1_9_4
          git diff --check

      - name: Verify release version
        env:
          RELEASE_TAG_OVERRIDE: Mod-v1.9.4
          JAVA_TOOL_OPTIONS: "-Dorg.gradle.native=false -Dorg.gradle.vfs.watch=false"
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew verifyReleaseVersion --no-daemon --stacktrace

      - name: Commit cleanup and repoint unpublished tag
        env:
          TAG: Mod-v1.9.4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/finalize_mod_v1_9_4.yml
          git add -A
          git diff --cached --check
          git commit -m "fix: finalize $TAG release pipeline"
          FINAL_SHA=$(git rev-parse HEAD)
          git push origin HEAD:main
          git tag -fa "$TAG" -m "APRSdroid Mod 1.9.4"
          git push --force origin "refs/tags/$TAG"
          echo "Final release commit: $FINAL_SHA"

      - name: Dispatch signed ARM64 and ARMv7 release build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: Mod-v1.9.4
        run: gh workflow run release.yml --ref "$TAG"

      - name: Remove temporary branches
        if: success()
        shell: bash
        run: |
          git push origin --delete automation/mod-v1.9.4 || true
          git push origin --delete bootstrap/mod-v1.9.4 || true
