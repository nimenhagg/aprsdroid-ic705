name: Repair Soft Recovery Workflow

on:
  push:
    branches:
      - fix/ic705-soft-recovery

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair and self-remove
        run: |
          sed -i "/github.event.head_commit.message/d" .github/workflows/apply-soft-recovery.yml
          rm .github/workflows/kick-soft-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: repair soft recovery workflow"
          git push origin HEAD:fix/ic705-soft-recovery
