name: Build and Publish Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          JAVA_TOOL_OPTIONS: "-Dorg.gradle.native=false -Dorg.gradle.vfs.watch=false"

      - name: Prepare and Sign Release APK
        id: sign_app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          GIT_VER=$(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)
          APK_SRC=$(find build/outputs/apk/release/ -name "*.apk" | head -n 1)
          APK_DEST="APRSdroid-${GIT_VER}.apk"
          
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing with repository secret keystore..."
            echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > release.jks
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --ks release.jks \
              --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass pass:"$KEY_PASSWORD" \
              --out "${APK_DEST}" "${APK_SRC}"
            rm -f release.jks
            echo "Verifying signature:"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "${APK_DEST}"
          else
            echo "No custom secret keystore configured, using build APK..."
            cp "${APK_SRC}" "${APK_DEST}"
          fi
          
          echo "apk_path=${APK_DEST}" >> $GITHUB_OUTPUT
          echo "git_ver=${GIT_VER}" >> $GITHUB_OUTPUT
          ls -la "${APK_DEST}"

      - name: Extract Release Notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 .github/scripts/extract_release_notes.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aprsdroid-apk
          path: ${{ steps.sign_app.outputs.apk_path }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.sign_app.outputs.apk_path }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
