name: Build and Publish Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Tests, Lint, and Build Release APK
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ -z "${MAPS_API_KEY:-}" ]; then
            echo "A tagged release requires the MAPS_API_KEY secret." >&2
            exit 1
          fi
          ./gradlew verifyReleaseVersion testArm64VulkanDebugUnitTest lintArm64VulkanDebug assembleRelease --no-daemon --stacktrace
        env:
          JAVA_TOOL_OPTIONS: "-Dorg.gradle.native=false -Dorg.gradle.vfs.watch=false"
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - name: Prepare, Verify, and Sign Release APKs
        id: sign_app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            BUILD_LABEL="$GITHUB_REF_NAME"
          else
            BUILD_LABEL=$(git rev-parse --short HEAD)
          fi

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "A tagged release requires KEYSTORE_BASE64 and its signing secrets." >&2
            exit 1
          fi

          mkdir -p release-apks
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Signing with repository secret keystore..."
            echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > release.jks
            BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
            APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          fi

          publish_apk() {
            local flavor="$1"
            local abi="$2"
            local renderer="$3"
            local maplibre_count="$4"
            local prefix="$5"
            local source
            source=$(find "build/outputs/apk/${flavor}/release" -name "*.apk" -print -quit)
            if [ -z "$source" ]; then
              echo "Missing APK for ${flavor}" >&2
              exit 1
            fi

            local destination="release-apks/${prefix}APRSdroid-${BUILD_LABEL}-${abi}-${renderer}.apk"
            if [ -n "${KEYSTORE_BASE64:-}" ]; then
              "$APKSIGNER" sign \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                --ks release.jks \
                --ks-pass pass:"$KEYSTORE_PASSWORD" \
                --ks-key-alias "$KEY_ALIAS" \
                --key-pass pass:"$KEY_PASSWORD" \
                --out "$destination" "$source"
              "$APKSIGNER" verify --verbose "$destination"
            else
              cp "$source" "$destination"
            fi

            mapfile -t packaged_abis < <(
              unzip -Z1 "$destination" |
                sed -n 's#^lib/\([^/]*\)/.*#\1#p' |
                sort -u
            )
            if [ "${#packaged_abis[@]}" -ne 1 ] || [ "${packaged_abis[0]}" != "$abi" ]; then
              echo "Unexpected ABIs in ${destination}: ${packaged_abis[*]}" >&2
              exit 1
            fi

            local actual_maplibre_count
            actual_maplibre_count=$(unzip -Z1 "$destination" | grep -c '/libmaplibre')
            if [ "$actual_maplibre_count" -ne "$maplibre_count" ]; then
              echo "Unexpected MapLibre backend count in ${destination}: ${actual_maplibre_count}" >&2
              exit 1
            fi
          }

          publish_apk arm64Vulkan arm64-v8a vulkan 1 Recommended_
          publish_apk arm64Opengl arm64-v8a opengl-compat 1 ""
          publish_apk arm32Opengl armeabi-v7a opengl 1 ""
          publish_apk x86Multi x86 vulkan-opengl 2 ""
          publish_apk x8664Multi x86_64 vulkan-opengl 2 ""

          rm -f release.jks
          (cd release-apks && sha256sum *.apk > SHA256SUMS.txt)
          mkdir -p release-mappings
          for flavor in arm64Vulkan arm64Opengl arm32Opengl x86Multi x8664Multi; do
            cp "build/outputs/mapping/${flavor}Release/mapping.txt" \
              "release-mappings/${flavor}-mapping.txt"
          done
          echo "build_label=${BUILD_LABEL}" >> "$GITHUB_OUTPUT"
          ls -lh release-apks
          ls -lh release-mappings

      - name: Extract Release Notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 .github/scripts/extract_release_notes.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aprsdroid-apks
          path: release-apks/*

      - name: Upload R8 Mapping Files
        uses: actions/upload-artifact@v4
        with:
          name: r8-mappings
          path: release-mappings/*.txt
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-apks/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
