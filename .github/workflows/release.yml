name: Build and Publish Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'Mod-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify APK
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:'))
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Graywolf build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libasound2-dev autoconf automake libtool patchelf
          cargo --version
          rustc --version
          protoc --version

      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/graywolf-jni/target
          key: graywolf-rust-v4-${{ runner.os }}-${{ hashFiles('native/graywolf-jni/Cargo.toml', 'native/graywolf-jni/Cargo.lock', '.github/scripts/test_graywolf_loopback.sh') }}

      - name: Run Graywolf production-rate loopbacks
        run: |
          bash .github/scripts/test_graywolf_loopback.sh
          git diff --exit-code -- native/graywolf-jni/Cargo.lock

      - name: Restore ARM64 MinSizeRel MapLibre
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/maplibre-minsizerel/13.5.1/arm64-v8a
          key: maplibre-minsizerel-v2-13.5.1-arm64-v8a-${{ hashFiles('.github/scripts/build_maplibre_minsizerel.sh') }}

      - name: Restore ARMv7 MinSizeRel MapLibre
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/maplibre-minsizerel/13.5.1/armeabi-v7a
          key: maplibre-minsizerel-v2-13.5.1-armeabi-v7a-${{ hashFiles('.github/scripts/build_maplibre_minsizerel.sh') }}

      - name: Build MinSizeRel MapLibre Native
        run: |
          bash .github/scripts/build_maplibre_minsizerel.sh \
            13.5.1 arm64-v8a \
            "$PWD/.cache/maplibre-minsizerel/13.5.1/arm64-v8a/libmaplibre.so"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            bash .github/scripts/build_maplibre_minsizerel.sh \
              13.5.1 armeabi-v7a \
              "$PWD/.cache/maplibre-minsizerel/13.5.1/armeabi-v7a/libmaplibre.so"
          fi

      - name: Build Graywolf Android Native
        run: |
          bash .github/scripts/build_graywolf_android.sh arm64-v8a
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            bash .github/scripts/build_graywolf_android.sh armeabi-v7a
          fi

      - name: Build pinned Hamlib Android Native
        run: |
          bash .github/scripts/build_hamlib_android.sh arm64-v8a
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            bash .github/scripts/build_hamlib_android.sh armeabi-v7a
          fi
          for abi in arm64-v8a armeabi-v7a; do
            if [ -s "build/generated/hamlibJniLibs/${abi}/libhamlib.so" ]; then
              bash .github/scripts/build_hamlib_jni_android.sh "$abi"
            fi
          done

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Tests, Blocking Lint, and Build Release APK
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ -z "${MAPS_API_KEY:-}" ]; then
            echo "A tagged release requires the MAPS_API_KEY secret." >&2
            exit 1
          fi

          tasks=(
            verifyReleaseVersion
            testArm64OpenglDebugUnitTest
            lintArm64OpenglDebug
            lintArm64OpenglRelease
            assembleArm64OpenglRelease
          )
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tasks+=(assembleArm32OpenglRelease)
          fi
          ./gradlew "${tasks[@]}" --no-daemon --stacktrace
        env:
          JAVA_TOOL_OPTIONS: "-Dorg.gradle.native=false -Dorg.gradle.vfs.watch=false"
          MAPS_API_KEY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.MAPS_API_KEY || '' }}

      - name: Prepare, Verify, and Sign Release APKs
        id: sign_app
        env:
          KEYSTORE_BASE64: ${{ startsWith(github.ref, 'refs/tags/') && secrets.KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/') && secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            BUILD_LABEL="$GITHUB_REF_NAME"
          else
            BUILD_LABEL=$(git rev-parse --short HEAD)
          fi

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "A tagged release requires KEYSTORE_BASE64 and its signing secrets." >&2
            exit 1
          fi

          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign"

          mkdir -p release-apks "$RUNNER_TEMP/maplibre-patched"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Signing tagged release with repository keystore..."
            echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > release.jks
          fi

          publish_apk() {
            local flavor="$1"
            local abi="$2"
            local renderer="$3"
            local maplibre_count="$4"
            local source
            source=$(find "build/outputs/apk/${flavor}/release" -name "*.apk" -print -quit)
            if [ -z "$source" ]; then
              echo "Missing APK for ${flavor}" >&2
              exit 1
            fi

            local custom_so="$PWD/.cache/maplibre-minsizerel/13.5.1/${abi}/libmaplibre.so"
            if [ ! -s "$custom_so" ]; then
              echo "Missing custom MinSizeRel MapLibre library for ${abi}" >&2
              exit 1
            fi
            local graywolf_so="$PWD/build/generated/rustJniLibs/${abi}/libaprs_graywolf.so"
            if [ ! -s "$graywolf_so" ]; then
              echo "Missing Graywolf JNI library for ${abi}" >&2
              exit 1
            fi
            local hamlib_so="$PWD/build/generated/hamlibJniLibs/${abi}/libhamlib.so"
            if [ ! -s "$hamlib_so" ]; then
              echo "Missing Hamlib native library for ${abi}" >&2
              exit 1
            fi
            local hamlib_jni_so="$PWD/build/generated/hamlibJniLibs/${abi}/libaprs_hamlib.so"
            if [ ! -s "$hamlib_jni_so" ]; then
              echo "Missing Hamlib JNI library for ${abi}" >&2
              exit 1
            fi

            local patched="$RUNNER_TEMP/maplibre-patched/${flavor}-patched.apk"
            local aligned="$RUNNER_TEMP/maplibre-patched/${flavor}-aligned.apk"
            python3 .github/scripts/replace_apk_maplibre.py \
              "$source" "$abi" "$custom_so" "$patched"
            "$ZIPALIGN" -P 16 -f 4 "$patched" "$aligned"
            "$ZIPALIGN" -P 16 -c 4 "$aligned"

            local destination="release-apks/APRSdroid-${BUILD_LABEL}-${abi}-${renderer}.apk"
            if [ -n "${KEYSTORE_BASE64:-}" ]; then
              "$APKSIGNER" sign \
                --v1-signing-enabled false \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                --v4-signing-enabled true \
                --ks release.jks \
                --ks-pass pass:"$KEYSTORE_PASSWORD" \
                --ks-key-alias "$KEY_ALIAS" \
                --key-pass pass:"$KEY_PASSWORD" \
                --out "$destination" "$aligned"
              "$APKSIGNER" verify --verbose "$destination"
            else
              cp "$aligned" "$destination"
            fi

            "$ZIPALIGN" -P 16 -c 4 "$destination"

            local expected_so actual_so
            expected_so=$(sha256sum "$custom_so" | awk '{print $1}')
            actual_so=$(unzip -p "$destination" "lib/${abi}/libmaplibre.so" | sha256sum | awk '{print $1}')
            if [ "$actual_so" != "$expected_so" ]; then
              echo "Packaged MapLibre hash mismatch for ${abi}" >&2
              echo "expected=${expected_so}" >&2
              echo "actual=${actual_so}" >&2
              exit 1
            fi
            echo "Verified MinSizeRel MapLibre ${abi}: ${actual_so}"

            local expected_graywolf actual_graywolf graywolf_count
            expected_graywolf=$(sha256sum "$graywolf_so" | awk '{print $1}')
            graywolf_count=$(unzip -Z1 "$destination" | grep -c "^lib/${abi}/libaprs_graywolf\\.so$")
            if [ "$graywolf_count" -ne 1 ]; then
              echo "Unexpected Graywolf JNI count for ${abi}: ${graywolf_count}" >&2
              exit 1
            fi
            actual_graywolf=$(unzip -p "$destination" "lib/${abi}/libaprs_graywolf.so" | sha256sum | awk '{print $1}')
            if [ "$actual_graywolf" != "$expected_graywolf" ]; then
              echo "Packaged Graywolf hash mismatch for ${abi}" >&2
              echo "expected=${expected_graywolf}" >&2
              echo "actual=${actual_graywolf}" >&2
              exit 1
            fi
            echo "Verified Graywolf JNI ${abi}: ${actual_graywolf}"

            local expected_hamlib actual_hamlib hamlib_count
            expected_hamlib=$(sha256sum "$hamlib_so" | awk '{print $1}')
            hamlib_count=$(unzip -Z1 "$destination" | grep -c "^lib/${abi}/libhamlib\\.so$")
            test "$hamlib_count" -eq 1
            actual_hamlib=$(unzip -p "$destination" "lib/${abi}/libhamlib.so" | sha256sum | awk '{print $1}')
            test "$actual_hamlib" = "$expected_hamlib"
            echo "Verified Hamlib native ${abi}: ${actual_hamlib}"

            local expected_hamlib_jni actual_hamlib_jni hamlib_jni_count
            expected_hamlib_jni=$(sha256sum "$hamlib_jni_so" | awk '{print $1}')
            hamlib_jni_count=$(unzip -Z1 "$destination" | grep -c "^lib/${abi}/libaprs_hamlib\\.so$")
            test "$hamlib_jni_count" -eq 1
            actual_hamlib_jni=$(unzip -p "$destination" "lib/${abi}/libaprs_hamlib.so" | sha256sum | awk '{print $1}')
            test "$actual_hamlib_jni" = "$expected_hamlib_jni"
            echo "Verified Hamlib JNI ${abi}: ${actual_hamlib_jni}"

            mapfile -t packaged_abis < <(
              unzip -Z1 "$destination" |
                sed -n 's#^lib/\([^/]*\)/.*#\1#p' |
                sort -u
            )
            if [ "${#packaged_abis[@]}" -ne 1 ] || [ "${packaged_abis[0]}" != "$abi" ]; then
              echo "Unexpected ABIs in ${destination}: ${packaged_abis[*]}" >&2
              exit 1
            fi

            local actual_maplibre_count
            actual_maplibre_count=$(unzip -Z1 "$destination" | grep -c '/libmaplibre')
            if [ "$actual_maplibre_count" -ne "$maplibre_count" ]; then
              echo "Unexpected MapLibre backend count in ${destination}: ${actual_maplibre_count}" >&2
              exit 1
            fi
          }

          publish_apk arm64Opengl arm64-v8a opengl 1
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            publish_apk arm32Opengl armeabi-v7a opengl 1
          fi

          rm -f release.jks
          (cd release-apks && sha256sum *.apk > SHA256SUMS.txt)
          mkdir -p release-mappings
          flavors=(arm64Opengl)
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            flavors+=(arm32Opengl)
          fi
          for flavor in "${flavors[@]}"; do
            mapping="build/outputs/mapping/${flavor}Release/mapping.txt"
            test -s "$mapping"
            cp "$mapping" "release-mappings/${flavor}-mapping.txt"
          done
          echo "build_label=${BUILD_LABEL}" >> "$GITHUB_OUTPUT"
          ls -lh release-apks
          ls -lh release-mappings

      - name: Package corresponding native sources
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          bash .github/scripts/package_graywolf_source.sh "$PWD/release-apks"
          bash .github/scripts/package_hamlib_source.sh "$PWD/release-apks"
          (cd release-apks && sha256sum *.apk *.tar.gz > SHA256SUMS.txt)

      - name: Extract Release Notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 .github/scripts/extract_release_notes.py

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aprsdroid-release-bundle
          path: |
            release-apks/*.apk
            release-apks/*.tar.gz
            release-apks/SHA256SUMS.txt
            release-mappings/*.txt
            RELEASE_NOTES.md
          if-no-files-found: error

      - name: Upload R8 Mapping Files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: r8-mappings
          path: release-mappings/*.txt
          if-no-files-found: error

  create_tag:
    name: Create validated release tag
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create and Dispatch Validated Release Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          subject=$(git log -1 --pretty=%s)
          case "$subject" in
            release:*) ;;
            *)
              echo "Not a release commit; skipping tag creation."
              exit 0
              ;;
          esac

          version=$(python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('build.gradle').read_text(encoding='utf-8')
          match = re.search(r'mod_version = \(findProperty\("MOD_VERSION"\) \?: "([0-9]+\.[0-9]+\.[0-9]+)"\)', text)
          if not match:
              raise SystemExit('Could not read default MOD_VERSION from build.gradle')
          print(match.group(1))
          PY
          )
          tag="Mod-v${version}"

          first_heading=$(grep -m1 '^## \[' CHANGELOG.md || true)
          case "$first_heading" in
            "## [${tag}] - "*) ;;
            *)
              echo "CHANGELOG top entry does not match ${tag}: ${first_heading}" >&2
              exit 1
              ;;
          esac
          grep -Fq "**最新稳定版 / Latest release: \`${tag}\`**" README.md || {
            echo "README latest release does not match ${tag}." >&2
            exit 1
          }
          grep -Fq "| 最新 GitHub Release | \`${tag}\` |" AGENT.md || {
            echo "AGENT release baseline does not match ${tag}." >&2
            exit 1
          }

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; not creating another tag."
            exit 0
          fi

          tag_object_sha=$(gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$tag" \
            -f message="$tag" \
            -f object="$GITHUB_SHA" \
            -f type="commit" \
            --jq '.sha')

          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${tag}" \
            -f sha="$tag_object_sha" >/dev/null

          for attempt in 1 2 3; do
            if gh workflow run release.yml --ref "$tag"; then
              echo "Created ${tag} and dispatched the tagged release workflow."
              exit 0
            fi
            echo "Dispatch attempt ${attempt} failed; retrying." >&2
            sleep 2
          done
          echo "Created ${tag}, but could not dispatch the tagged release workflow." >&2
          exit 1

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: aprsdroid-release-bundle
          path: release-bundle

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            release-bundle/release-apks/*.apk
            release-bundle/release-apks/*.tar.gz
            release-bundle/release-apks/SHA256SUMS.txt
            release-bundle/release-mappings/*.txt
          body_path: release-bundle/RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
