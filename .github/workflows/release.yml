name: Build and Publish Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          JAVA_TOOL_OPTIONS: "-Dorg.gradle.native=false -Dorg.gradle.vfs.watch=false"

      - name: Prepare and Sign Release APK with Private Keystore
        id: sign_app
        run: |
          GIT_VER=$(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)
          APK_SRC=$(find build/outputs/apk/release/ -name "*.apk" | head -n 1)
          APK_DEST="APRSdroid-${GIT_VER}.apk"
          
          KS_FILE="keystore/aprsdroid-release.jks"
          KS_PASS="Aprs705_NimenHagg_Sec2026"
          KEY_ALIAS="nimenhagg"
          KEY_PASS="Aprs705_NimenHagg_Sec2026"
          
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using repository secret keystore..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > secret_release.jks
            KS_FILE="secret_release.jks"
            KS_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
            KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
            KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          else
            echo "Using bundled private release keystore: ${KS_FILE}"
          fi
          
          echo "Signing APK with apksigner (v1, v2, v3 schemes)..."
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --ks "${KS_FILE}" \
            --ks-pass pass:"${KS_PASS}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --key-pass pass:"${KEY_PASS}" \
            --out "${APK_DEST}" "${APK_SRC}"
            
          echo "Verifying signed APK signature..."
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "${APK_DEST}"
          
          echo "apk_path=${APK_DEST}" >> $GITHUB_OUTPUT
          echo "git_ver=${GIT_VER}" >> $GITHUB_OUTPUT
          ls -la "${APK_DEST}"

      - name: Extract Release Notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 .github/scripts/extract_release_notes.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aprsdroid-apk
          path: ${{ steps.sign_app.outputs.apk_path }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.sign_app.outputs.apk_path }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
