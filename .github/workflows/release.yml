name: Build and Publish Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'Mod-v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  prepare_mod_1_9_4:
    name: Prepare Mod-v1.9.4 when requested
    runs-on: ubuntu-latest
    outputs:
      prepare: ${{ steps.marker.outputs.prepare }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect guarded preparation marker
        id: marker
        shell: bash
        run: |
          if [ -f .github/.prepare_mod_v1_9_4 ]; then
            echo "prepare=true" >> "$GITHUB_OUTPUT"
          else
            echo "prepare=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load and decode prepared patch
        if: steps.marker.outputs.prepare == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/mod-v1.9.4
          git show origin/automation/mod-v1.9.4:.github/scripts/apply_mod_v1_9_4.py.gz.b64 \
            | base64 -d \
            | gzip -d > "$RUNNER_TEMP/apply_mod_v1_9_4.py"
          python3 -m py_compile "$RUNNER_TEMP/apply_mod_v1_9_4.py"

      - name: Restore prepared patch baseline
        if: steps.marker.outputs.prepare == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git checkout 4d112f17fb17494aece0b8221212555f2b6f4efb -- \
            .github/workflows/release.yml \
            .github/scripts/extract_release_notes.py

      - name: Apply Mod-v1.9.4 changes
        if: steps.marker.outputs.prepare == 'true'
        run: python3 "$RUNNER_TEMP/apply_mod_v1_9_4.py"

      - name: Set up JDK 17
        if: steps.marker.outputs.prepare == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Verify source changes
        if: steps.marker.outputs.prepare == 'true'
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          JAVA_TOOL_OPTIONS: "-Dorg.gradle.native=false -Dorg.gradle.vfs.watch=false"
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          git diff --check
          ./gradlew verifyReleaseVersion testArm64OpenglDebugUnitTest lintArm64OpenglDebug --no-daemon --stacktrace

      - name: Commit release source and create tag
        if: steps.marker.outputs.prepare == 'true'
        env:
          TAG: Mod-v1.9.4
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to move it." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/.prepare_mod_v1_9_4
          git rm -f .github/workflows/prepare_mod_v1_9_4.yml
          git add -A
          git diff --cached --check
          git commit -m "release: $TAG"
          git push origin HEAD:main
          git tag -a "$TAG" -m "APRSdroid Mod 1.9.4"
          git push origin "refs/tags/$TAG"

      - name: Dispatch signed release build
        if: steps.marker.outputs.prepare == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: Mod-v1.9.4
        run: gh workflow run release.yml --ref "$TAG"

      - name: Remove temporary branches
        if: steps.marker.outputs.prepare == 'true' && success()
        shell: bash
        run: |
          git push origin --delete automation/mod-v1.9.4 || true
          git push origin --delete bootstrap/mod-v1.9.4 || true

  build:
    name: Build & Release APK
    needs: prepare_mod_1_9_4
    if: needs.prepare_mod_1_9_4.outputs.prepare != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore ARM64 MinSizeRel MapLibre
        uses: actions/cache@v6
        with:
          path: .cache/maplibre-minsizerel/13.5.1/arm64-v8a
          key: maplibre-minsizerel-v1-13.5.1-arm64-v8a-${{ hashFiles('.github/scripts/build_maplibre_minsizerel.sh') }}

      - name: Restore ARMv7 MinSizeRel MapLibre
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/cache@v6
        with:
          path: .cache/maplibre-minsizerel/13.5.1/armeabi-v7a
          key: maplibre-minsizerel-v1-13.5.1-armeabi-v7a-${{ hashFiles('.github/scripts/build_maplibre_minsizerel.sh') }}

      - name: Build MinSizeRel MapLibre Native
        run: |
          bash .github/scripts/build_maplibre_minsizerel.sh \
            13.5.1 arm64-v8a \
            "$PWD/.cache/maplibre-minsizerel/13.5.1/arm64-v8a/libmaplibre.so"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            bash .github/scripts/build_maplibre_minsizerel.sh \
              13.5.1 armeabi-v7a \
              "$PWD/.cache/maplibre-minsizerel/13.5.1/armeabi-v7a/libmaplibre.so"
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Tests, Lint, and Build Release APK
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ -z "${MAPS_API_KEY:-}" ]; then
            echo "A tagged release requires the MAPS_API_KEY secret." >&2
            exit 1
          fi

          tasks=(
            verifyReleaseVersion
            testArm64OpenglDebugUnitTest
            lintArm64OpenglDebug
            assembleArm64OpenglRelease
          )
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tasks+=(assembleArm32OpenglRelease)
          fi
          ./gradlew "${tasks[@]}" --no-daemon --stacktrace
        env:
          JAVA_TOOL_OPTIONS: "-Dorg.gradle.native=false -Dorg.gradle.vfs.watch=false"
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - name: Prepare, Verify, and Sign Release APKs
        id: sign_app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            BUILD_LABEL="$GITHUB_REF_NAME"
          else
            BUILD_LABEL=$(git rev-parse --short HEAD)
          fi

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "A tagged release requires KEYSTORE_BASE64 and its signing secrets." >&2
            exit 1
          fi

          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign"

          mkdir -p release-apks "$RUNNER_TEMP/maplibre-patched"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Signing with repository secret keystore..."
            echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > release.jks
          fi

          publish_apk() {
            local flavor="$1"
            local abi="$2"
            local renderer="$3"
            local maplibre_count="$4"
            local prefix="$5"
            local source
            source=$(find "build/outputs/apk/${flavor}/release" -name "*.apk" -print -quit)
            if [ -z "$source" ]; then
              echo "Missing APK for ${flavor}" >&2
              exit 1
            fi

            local custom_so="$PWD/.cache/maplibre-minsizerel/13.5.1/${abi}/libmaplibre.so"
            if [ ! -s "$custom_so" ]; then
              echo "Missing custom MinSizeRel MapLibre library for ${abi}" >&2
              exit 1
            fi

            local patched="$RUNNER_TEMP/maplibre-patched/${flavor}-patched.apk"
            local aligned="$RUNNER_TEMP/maplibre-patched/${flavor}-aligned.apk"
            python3 .github/scripts/replace_apk_maplibre.py \
              "$source" "$abi" "$custom_so" "$patched"
            "$ZIPALIGN" -P 16 -f 4 "$patched" "$aligned"
            "$ZIPALIGN" -P 16 -c 4 "$aligned"

            local destination="release-apks/${prefix}APRSdroid-${BUILD_LABEL}-${abi}-${renderer}.apk"
            if [ -n "${KEYSTORE_BASE64:-}" ]; then
              "$APKSIGNER" sign \
                --v1-signing-enabled false \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                --v4-signing-enabled true \
                --ks release.jks \
                --ks-pass pass:"$KEYSTORE_PASSWORD" \
                --ks-key-alias "$KEY_ALIAS" \
                --key-pass pass:"$KEY_PASSWORD" \
                --out "$destination" "$aligned"
              "$APKSIGNER" verify --verbose "$destination"
            else
              cp "$aligned" "$destination"
            fi

            "$ZIPALIGN" -P 16 -c 4 "$destination"

            local expected_so actual_so
            expected_so=$(sha256sum "$custom_so" | awk '{print $1}')
            actual_so=$(unzip -p "$destination" "lib/${abi}/libmaplibre.so" | sha256sum | awk '{print $1}')
            if [ "$actual_so" != "$expected_so" ]; then
              echo "Packaged MapLibre hash mismatch for ${abi}" >&2
              echo "expected=${expected_so}" >&2
              echo "actual=${actual_so}" >&2
              exit 1
            fi
            echo "Verified MinSizeRel MapLibre ${abi}: ${actual_so}"

            mapfile -t packaged_abis < <(
              unzip -Z1 "$destination" |
                sed -n 's#^lib/\([^/]*\)/.*#\1#p' |
                sort -u
            )
            if [ "${#packaged_abis[@]}" -ne 1 ] || [ "${packaged_abis[0]}" != "$abi" ]; then
              echo "Unexpected ABIs in ${destination}: ${packaged_abis[*]}" >&2
              exit 1
            fi

            local actual_maplibre_count
            actual_maplibre_count=$(unzip -Z1 "$destination" | grep -c '/libmaplibre')
            if [ "$actual_maplibre_count" -ne "$maplibre_count" ]; then
              echo "Unexpected MapLibre backend count in ${destination}: ${actual_maplibre_count}" >&2
              exit 1
            fi
          }

          publish_apk arm64Opengl arm64-v8a opengl 1 "Recommended_"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            publish_apk arm32Opengl armeabi-v7a opengl 1 ""
          fi

          rm -f release.jks
          (cd release-apks && sha256sum *.apk > SHA256SUMS.txt)
          mkdir -p release-mappings
          flavors=(arm64Opengl)
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            flavors+=(arm32Opengl)
          fi
          for flavor in "${flavors[@]}"; do
            if [ -f "build/outputs/mapping/${flavor}Release/mapping.txt" ]; then
              cp "build/outputs/mapping/${flavor}Release/mapping.txt" \
                "release-mappings/${flavor}-mapping.txt"
            fi
          done
          echo "build_label=${BUILD_LABEL}" >> "$GITHUB_OUTPUT"
          ls -lh release-apks
          ls -lh release-mappings

      - name: Extract Release Notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 .github/scripts/extract_release_notes.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: aprsdroid-apks
          path: |
            release-apks/*.apk
            release-apks/SHA256SUMS.txt

      - name: Upload R8 Mapping Files
        uses: actions/upload-artifact@v7
        with:
          name: r8-mappings
          path: release-mappings/*.txt
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-apks/*.apk
            release-apks/SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
