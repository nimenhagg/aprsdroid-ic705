name: Build and Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          JAVA_TOOL_OPTIONS: "-Dorg.gradle.native=false -Dorg.gradle.vfs.watch=false"

      - name: Prepare and Sign Release APK
        id: sign_app
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.7.0-ic705}"
          APK_SRC=$(find build/outputs/apk/release/ -name "*.apk" | head -n 1)
          APK_DEST="APRSdroid-${TAG_NAME}.apk"
          
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Signing with repository secret keystore..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --ks release.jks \
              --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
              --out "${APK_DEST}" "${APK_SRC}"
            rm -f release.jks
          else
            echo "No custom secret keystore configured, using build APK..."
            cp "${APK_SRC}" "${APK_DEST}"
          fi
          
          echo "apk_path=${APK_DEST}" >> $GITHUB_OUTPUT
          ls -la "${APK_DEST}"

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.sign_app.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
