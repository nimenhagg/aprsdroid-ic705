name: Build and Publish Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'Mod-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify APK
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Graywolf build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libasound2-dev autoconf automake libtool patchelf
          cargo --version
          rustc --version
          protoc --version

      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/graywolf-jni/target
          key: graywolf-rust-v4-${{ runner.os }}-${{ hashFiles('native/graywolf-jni/Cargo.toml', 'native/graywolf-jni/Cargo.lock', '.github/scripts/test_graywolf_loopback.sh') }}

      - name: Run Graywolf production-rate loopbacks
        run: |
          bash .github/scripts/test_graywolf_loopback.sh
          git diff --exit-code -- native/graywolf-jni/Cargo.lock

      - name: Restore MinSizeRel MapLibre caches
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/maplibre-minsizerel/13.5.1/arm64-v8a
            .cache/maplibre-minsizerel/13.5.1/armeabi-v7a
            .cache/maplibre-minsizerel/13.5.1/x86
            .cache/maplibre-minsizerel/13.5.1/x86_64
          key: ${{ runner.os }}-${{ hashFiles('.github/scripts/build_maplibre_minsizerel.sh') }}

      - name: Build, verify, and publish architectures sequentially
        env:
          KEYSTORE_BASE64: ${{ startsWith(github.ref, 'refs/tags/') && secrets.KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/') && secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.KEY_PASSWORD || '' }}
          MAPS_API_KEY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.MAPS_API_KEY || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BUILD_LABEL="$GITHUB_REF_NAME"
          [ "$GITHUB_REF_TYPE" = "tag" ] || BUILD_LABEL="$(git rev-parse --short HEAD)"
          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign"
          mkdir -p release-apks release-mappings "$RUNNER_TEMP/maplibre-patched"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            [ -n "$KEYSTORE_BASE64" ] || { echo "Missing signing secrets" >&2; exit 1; }
            [ -n "$MAPS_API_KEY" ] || { echo "Missing MAPS_API_KEY" >&2; exit 1; }
            echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > release.jks
          fi
          build_native() {
            local abi="$1"
            bash .github/scripts/build_maplibre_minsizerel.sh 13.5.1 "$abi" ".cache/maplibre-minsizerel/13.5.1/$abi/libmaplibre.so"
            bash .github/scripts/build_graywolf_android.sh "$abi"
            bash .github/scripts/build_hamlib_android.sh "$abi"
            bash .github/scripts/build_hamlib_jni_android.sh "$abi"
          }
          build_and_package() {
            local flavor="$1" abi="$2" task="$3"
            build_native "$abi"
            ./gradlew "$task" --no-daemon --stacktrace
            local source="$(find "build/outputs/apk/$flavor/release" -name '*.apk' -print -quit)"
            [ -n "$source" ] || { echo "Missing APK for $flavor" >&2; exit 1; }
            local so=".cache/maplibre-minsizerel/13.5.1/$abi/libmaplibre.so"
            local gray="build/generated/rustJniLibs/$abi/libaprs_graywolf.so"
            local ham="build/generated/hamlibJniLibs/$abi/libhamlib.so"
            local jni="build/generated/hamlibJniLibs/$abi/libaprs_hamlib.so"
            for f in "$so" "$gray" "$ham" "$jni"; do [ -s "$f" ] || { echo "Missing native artifact: $f" >&2; exit 1; }; done
            local patched="$RUNNER_TEMP/maplibre-patched/$flavor-patched.apk"
            local aligned="$RUNNER_TEMP/maplibre-patched/$flavor-aligned.apk"
            python3 .github/scripts/replace_apk_maplibre.py "$source" "$abi" "$so" "$patched"
            "$ZIPALIGN" -P 16 -f 4 "$patched" "$aligned"
            local dest="release-apks/APRSdroid-$BUILD_LABEL-$abi-opengl.apk"
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              "$APKSIGNER" sign --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled true --ks release.jks --ks-pass pass:"$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass pass:"$KEY_PASSWORD" --out "$dest" "$aligned"
              "$APKSIGNER" verify --verbose "$dest"
            else
              cp "$aligned" "$dest"
            fi
            "$ZIPALIGN" -P 16 -c 4 "$dest"
            test "$(unzip -p "$dest" "lib/$abi/libmaplibre.so" | sha256sum | awk '{print $1}')" = "$(sha256sum "$so" | awk '{print $1}')"
            test "$(unzip -p "$dest" "lib/$abi/libaprs_graywolf.so" | sha256sum | awk '{print $1}')" = "$(sha256sum "$gray" | awk '{print $1}')"
            test "$(unzip -p "$dest" "lib/$abi/libhamlib.so" | sha256sum | awk '{print $1}')" = "$(sha256sum "$ham" | awk '{print $1}')"
            test "$(unzip -p "$dest" "lib/$abi/libaprs_hamlib.so" | sha256sum | awk '{print $1}')" = "$(sha256sum "$jni" | awk '{print $1}')"
            local abi_count="$(unzip -Z1 "$dest" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u | wc -l | tr -d ' ')"
            [ "$abi_count" = "1" ] || { echo "Unexpected packaged ABI count: $abi_count" >&2; exit 1; }
            cp "build/outputs/mapping/$flavor""Release/mapping.txt" "release-mappings/$flavor-mapping.txt"
            test -s "release-mappings/$flavor-mapping.txt"
          }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ./gradlew verifyReleaseVersion testArm64OpenglDebugUnitTest lintArm64OpenglDebug lintArm64OpenglRelease --no-daemon --stacktrace
          fi
          build_and_package arm64Opengl arm64-v8a assembleArm64OpenglRelease
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then rm -f release.jks; exit 0; fi
          bash .github/scripts/package_graywolf_source.sh "$PWD/release-apks"
          bash .github/scripts/package_hamlib_source.sh "$PWD/release-apks"
          python3 .github/scripts/extract_release_notes.py
          (cd release-apks && sha256sum *.apk *.tar.gz > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" release-apks/*.apk release-apks/*.tar.gz release-apks/SHA256SUMS.txt release-mappings/arm64Opengl-mapping.txt --verify-tag --notes-file RELEASE_NOTES.md --title "$GITHUB_REF_NAME"
          build_and_package arm32Opengl armeabi-v7a assembleArm32OpenglRelease
          gh release upload "$GITHUB_REF_NAME" "release-apks/APRSdroid-$BUILD_LABEL-armeabi-v7a-opengl.apk" release-mappings/arm32Opengl-mapping.txt --clobber
          build_and_package x86Multi x86 assembleX86MultiRelease
          gh release upload "$GITHUB_REF_NAME" "release-apks/APRSdroid-$BUILD_LABEL-x86-opengl.apk" release-mappings/x86Multi-mapping.txt --clobber
          build_and_package x8664Multi x86_64 assembleX8664MultiRelease
          gh release upload "$GITHUB_REF_NAME" "release-apks/APRSdroid-$BUILD_LABEL-x86_64-opengl.apk" release-mappings/x8664Multi-mapping.txt --clobber
          (cd release-apks && sha256sum *.apk *.tar.gz > SHA256SUMS.txt)
          gh release delete-asset "$GITHUB_REF_NAME" SHA256SUMS.txt --yes
          gh release upload "$GITHUB_REF_NAME" release-apks/SHA256SUMS.txt --clobber
          rm -f release.jks
      - name: Upload R8 Mapping Files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: r8-mappings
          path: release-mappings/*.txt
          if-no-files-found: error

  create_tag:
    name: Create validated release tag
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create and Dispatch Validated Release Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          subject=$(git log -1 --pretty=%s)
          case "$subject" in
            release:*) ;;
            *)
              echo "Not a release commit; skipping tag creation."
              exit 0
              ;;
          esac

          version=$(python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('build.gradle').read_text(encoding='utf-8')
          match = re.search(r'mod_version = \(findProperty\("MOD_VERSION"\) \?: "([0-9]+\.[0-9]+\.[0-9]+)"\)', text)
          if not match:
              raise SystemExit('Could not read default MOD_VERSION from build.gradle')
          print(match.group(1))
          PY
          )
          tag="Mod-v${version}"

          first_heading=$(grep -m1 '^## \[' CHANGELOG.md || true)
          case "$first_heading" in
            "## [${tag}] - "*) ;;
            *)
              echo "CHANGELOG top entry does not match ${tag}: ${first_heading}" >&2
              exit 1
              ;;
          esac
          grep -Fq "**最新稳定版 / Latest release: \`${tag}\`**" README.md || {
            echo "README latest release does not match ${tag}." >&2
            exit 1
          }
          grep -Fq "| 最新 GitHub Release | \`${tag}\` |" AGENT.md || {
            echo "AGENT release baseline does not match ${tag}." >&2
            exit 1
          }

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; not creating another tag."
            exit 0
          fi

          tag_object_sha=$(gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$tag" \
            -f message="$tag" \
            -f object="$GITHUB_SHA" \
            -f type="commit" \
            --jq '.sha')

          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${tag}" \
            -f sha="$tag_object_sha" >/dev/null

          for attempt in 1 2 3; do
            if gh workflow run release.yml --ref "$tag"; then
              echo "Created ${tag} and dispatched the tagged release workflow."
              exit 0
            fi
            echo "Dispatch attempt ${attempt} failed; retrying." >&2
            sleep 2
          done
          echo "Created ${tag}, but could not dispatch the tagged release workflow." >&2
          exit 1

