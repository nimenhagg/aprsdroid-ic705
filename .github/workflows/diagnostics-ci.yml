name: Structured Diagnostics CI

on:
  push:
    branches:
      - feat/structured-diagnostics

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Unit tests and lint
        run: ./gradlew test lint --stacktrace
      - name: Release builds
        run: ./gradlew assembleArm64VulkanRelease assembleArm32OpenglRelease --stacktrace
