name: Backend Modernization CI

on:
  push:
    branches:
      - refactor/backend-modernization
    paths:
      - '.github/ci-trigger/backend-modernization'

permissions:
  contents: read

jobs:
  verify:
    name: Debug Unit, Lint & ARM64 Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Debug Validation
        env:
          JAVA_TOOL_OPTIONS: "-Dorg.gradle.native=false -Dorg.gradle.vfs.watch=false"
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          ./gradlew \
            testArm64OpenglDebugUnitTest \
            lintArm64OpenglDebug \
            assembleArm64OpenglDebug \
            --no-daemon --stacktrace
