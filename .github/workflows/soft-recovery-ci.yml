name: IC-705 Soft Recovery CI

on:
  push:
    branches:
      - fix/ic705-soft-recovery

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Apply patch if needed
        run: python3 tools/apply_soft_recovery.py
      - name: Verify
        run: |
          chmod +x gradlew
          ./gradlew testArm64OpenglDebugUnitTest lintArm64OpenglDebug assembleArm64OpenglRelease assembleArm32OpenglRelease --no-daemon --stacktrace
        env:
          JAVA_TOOL_OPTIONS: "-Dorg.gradle.native=false -Dorg.gradle.vfs.watch=false"
      - name: Commit verified source changes
        run: |
          if git diff --quiet -- src test; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test
          git commit -m "fix: add IC-705 stream soft recovery"
          git push origin HEAD:fix/ic705-soft-recovery
