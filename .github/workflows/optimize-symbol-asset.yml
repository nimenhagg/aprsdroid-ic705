name: Optimize APRS symbol asset

on:
  push:
    branches:
      - perf/ci-size-optimization

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Convert APRS symbol sprite to lossless WebP
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          before=$(stat -c%s res/drawable-nodpi/allicons.png)
          cwebp -quiet -lossless -m 4 res/drawable-nodpi/allicons.png -o res/drawable-nodpi/allicons.webp
          after=$(stat -c%s res/drawable-nodpi/allicons.webp)
          echo "allicons: ${before} -> ${after} bytes"
          test "$after" -lt "$before"
          rm res/drawable-nodpi/allicons.png
      - name: Commit optimized asset
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/drawable-nodpi/allicons.png res/drawable-nodpi/allicons.webp
          git commit -m "perf: store APRS symbol sprite as lossless WebP"
          git push
