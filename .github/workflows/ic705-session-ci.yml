name: IC-705 Session Recovery CI

on:
  push:
    branches:
      - fix/ic705-session-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test, Lint & Build ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests, Lint, and Build APKs
        env:
          JAVA_TOOL_OPTIONS: "-Dorg.gradle.native=false -Dorg.gradle.vfs.watch=false"
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          ./gradlew \
            testArm64OpenglDebugUnitTest \
            lintArm64OpenglDebug \
            assembleArm64OpenglDebug \
            assembleArm64OpenglRelease \
            --no-daemon --stacktrace

      - name: Prepare Installable APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          short_sha=$(git rev-parse --short HEAD)
          mkdir -p ci-apks

          debug_apk=$(find build/outputs/apk/arm64Opengl/debug -name '*.apk' -print -quit)
          test -n "$debug_apk"
          cp "$debug_apk" "ci-apks/APRSdroid-${short_sha}-arm64-v8a-debug.apk"

          release_apk=$(find build/outputs/apk/arm64Opengl/release -name '*.apk' -print -quit)
          test -n "$release_apk"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > release.jks
            build_tools_version=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
            apksigner="$ANDROID_HOME/build-tools/$build_tools_version/apksigner"
            zipalign="$ANDROID_HOME/build-tools/$build_tools_version/zipalign"
            aligned="$RUNNER_TEMP/ic705-session-aligned.apk"
            "$zipalign" -P 16 -f 4 "$release_apk" "$aligned"
            "$apksigner" sign \
              --v1-signing-enabled false \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled true \
              --ks release.jks \
              --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass pass:"$KEY_PASSWORD" \
              --out "ci-apks/APRSdroid-${short_sha}-arm64-v8a-release-signed.apk" \
              "$aligned"
            "$apksigner" verify --verbose "ci-apks/APRSdroid-${short_sha}-arm64-v8a-release-signed.apk"
            rm -f release.jks
          else
            echo "Repository release signing secrets unavailable; debug APK remains installable."
          fi

          (cd ci-apks && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh ci-apks

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ic705-session-recovery-apks
          path: |
            ci-apks/*.apk
            ci-apks/SHA256SUMS.txt
          if-no-files-found: error
