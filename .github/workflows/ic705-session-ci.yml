name: IC-705 Session Recovery CI

on:
  push:
    branches:
      - fix/ic705-session-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test, Lint & Build ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests, Lint, and Build APKs
        env:
          JAVA_TOOL_OPTIONS: "-Dorg.gradle.native=false -Dorg.gradle.vfs.watch=false"
        run: |
          ./gradlew \
            testArm64OpenglDebugUnitTest \
            lintArm64OpenglDebug \
            assembleArm64OpenglDebug \
            assembleArm64OpenglRelease \
            --no-daemon --stacktrace

      - name: Prepare Installable Debug APK
        run: |
          set -euo pipefail
          short_sha=$(git rev-parse --short HEAD)
          mkdir -p ci-apks

          debug_apk=$(find build/outputs/apk/arm64Opengl/debug -name '*.apk' -print -quit)
          test -n "$debug_apk"
          cp "$debug_apk" "ci-apks/APRSdroid-${short_sha}-arm64-v8a-debug.apk"

          (cd ci-apks && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh ci-apks

      - name: Upload APK Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ic705-session-recovery-apks
          path: |
            ci-apks/*.apk
            ci-apks/SHA256SUMS.txt
          if-no-files-found: error
