name: Full-build IC-705 session stability fix

on:
  push:
    branches:
      - fix/ic705-session-stability

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ic705-session-stability
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Remove one-off workflow
        run: rm .github/workflows/ic705-session-stability-build.yml

      - name: Run tests lint and both release builds
        run: ./gradlew testArm64OpenglDebugUnitTest lintArm64OpenglDebug assembleArm64OpenglRelease assembleArm32OpenglRelease --no-daemon --stacktrace

      - name: Commit workflow cleanup after successful build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ic705-session-stability-build.yml
          git commit -m 'ci: remove stability full-build workflow'
          git push origin HEAD:fix/ic705-session-stability
