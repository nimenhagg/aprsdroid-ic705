name: Prepare Mod-v1.9.4 Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/prepare_mod_v1_9_4.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Load and decode patch payload
        run: |
          git fetch origin automation/mod-v1.9.4
          git show origin/automation/mod-v1.9.4:.github/scripts/apply_mod_v1_9_4.py.gz.b64 | base64 -d | gzip -d > "$RUNNER_TEMP/apply_mod_v1_9_4.py"
          python3 -m py_compile "$RUNNER_TEMP/apply_mod_v1_9_4.py"

      - name: Apply Mod-v1.9.4 changes
        run: python3 "$RUNNER_TEMP/apply_mod_v1_9_4.py"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Verify source changes
        env:
          RELEASE_TAG_OVERRIDE: Mod-v1.9.4
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          JAVA_TOOL_OPTIONS: "-Dorg.gradle.native=false -Dorg.gradle.vfs.watch=false"
        run: |
          chmod +x gradlew
          git diff --check
          ./gradlew verifyReleaseVersion testArm64OpenglDebugUnitTest lintArm64OpenglDebug --no-daemon --stacktrace

      - name: Commit release source and create tag
        id: release_commit
        env:
          TAG: Mod-v1.9.4
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to move it." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare_mod_v1_9_4.yml
          git add -A
          git diff --cached --check
          git commit -m "release: $TAG"
          RELEASE_SHA=$(git rev-parse HEAD)
          git push origin HEAD:main
          git tag -a "$TAG" -m "APRSdroid Mod 1.9.4"
          git push origin "refs/tags/$TAG"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Dispatch signed release build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: Mod-v1.9.4
        run: gh workflow run release.yml --ref "$TAG"

      - name: Remove temporary automation branch
        if: success()
        run: git push origin --delete automation/mod-v1.9.4
