name: Apply IC-705 session stability patch v2

on:
  push:
    branches:
      - fix/ic705-session-stability

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ic705-session-stability
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Patch session coordinator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/ic705/session/Ic705RxSession.kt')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              text = text.replace(old, new, 1)

          def sub_once(pattern: str, replacement: str, label: str) -> None:
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected one regex match, got {count}')

          replace_once(
              "    val watchdogPeriodMillis: Long = 500L,\n"
              "    val channelTimeoutMillis: Long = 3_000L,\n"
              "    val handshakeStageTimeoutMillis: Long = 10_000L,",
              "    val watchdogPeriodMillis: Long = 500L,\n"
              "    /** CONTROL is authoritative for whole-session liveness. */\n"
              "    val channelTimeoutMillis: Long = 5_000L,\n"
              "    /** CI-V remains latency-sensitive, but is independent from RX audio silence. */\n"
              "    val civChannelTimeoutMillis: Long = 3_000L,\n"
              "    /** RX audio may legitimately be silent for long periods, especially around TX. */\n"
              "    val audioChannelTimeoutMillis: Long = 30_000L,\n"
              "    /** Give the radio time to resume RX audio after PTT OFF is acknowledged. */\n"
              "    val audioPostTxGraceMillis: Long = 5_000L,\n"
              "    val handshakeStageTimeoutMillis: Long = 10_000L,",
              'timing fields',
          )

          replace_once(
              "            watchdogPeriodMillis,\n"
              "            channelTimeoutMillis,\n"
              "            handshakeStageTimeoutMillis,",
              "            watchdogPeriodMillis,\n"
              "            channelTimeoutMillis,\n"
              "            civChannelTimeoutMillis,\n"
              "            audioChannelTimeoutMillis,\n"
              "            audioPostTxGraceMillis,\n"
              "            handshakeStageTimeoutMillis,",
              'timing validation',
          )

          replace_once(
              "    @Volatile\n"
              "    private var lastTxCompletedMonotonicMillis = 0L\n\n"
              "    private val pttStateMachine:",
              "    @Volatile\n"
              "    private var lastTxCompletedMonotonicMillis = 0L\n\n"
              "    @Volatile\n"
              "    private var audioWatchdogGraceUntilMillis = 0L\n\n"
              "    private val pttStateMachine:",
              'audio watchdog grace state',
          )

          replace_once(
              "            override fun onStateChanged(state: Ic705PttState) {\n"
              "                // PTT state change hook\n"
              "            }\n"
              "        },\n"
              "    )",
              "            override fun onStateChanged(state: Ic705PttState) {\n"
              "                if (state == Ic705PttState.RX_IDLE) {\n"
              "                    audioWatchdogGraceUntilMillis =\n"
              "                        monotonicMillis() + config.timing.audioPostTxGraceMillis\n"
              "                }\n"
              "            }\n"
              "        },\n"
              "        watchdogExecutor = controlExecutor,\n"
              "    )",
              'PTT callback/executor',
          )

          replace_once(
              "            val started = pttStateMachine.beginTransmission()\n"
              "            if (!started) {\n"
              "                Log.w(TAG, \"transmit() pttStateMachine.beginTransmission() returned false\")\n"
              "                return false\n"
              "            }",
              "            val started = try {\n"
              "                pttStateMachine.beginTransmission()\n"
              "            } catch (error: Exception) {\n"
              "                Log.e(TAG, \"transmit() failed to send PTT ON\", error)\n"
              "                reportIssue(Ic705RxSessionIssueCode.SOCKET_IO, Ic705ChannelRole.CIV)\n"
              "                return false\n"
              "            }\n"
              "            if (!started) {\n"
              "                Log.w(TAG, \"transmit() pttStateMachine.beginTransmission() returned false\")\n"
              "                return false\n"
              "            }",
              'PTT ON failure propagation',
          )

          replace_once(
              "                        if (!pttStateMachine.isTransmitting || closed.get() || engineState.phase != Ic705RxSessionEngine.Phase.RECEIVING) {\n"
              "                            Log.w(TAG, \"startTxAudioStreaming: aborted at packet $index (transmitting=${pttStateMachine.isTransmitting}, closed=${closed.get()}, phase=${engineState.phase})\")",
              "                        if (!pttStateMachine.canStreamAudio || closed.get() || engineState.phase != Ic705RxSessionEngine.Phase.RECEIVING) {\n"
              "                            Log.w(TAG, \"startTxAudioStreaming: aborted at packet $index (canStreamAudio=${pttStateMachine.canStreamAudio}, pttState=${pttStateMachine.state}, closed=${closed.get()}, phase=${engineState.phase})\")",
              'TX loop stop condition',
          )

          replace_once(
              "                    if (pttStateMachine.isTransmitting && !closed.get()) {\n"
              "                        pttStateMachine.onAudioStreamingFinished()",
              "                    if (pttStateMachine.canStreamAudio && !closed.get()) {\n"
              "                        pttStateMachine.onAudioStreamingFinished()",
              'TX drain condition',
          )

          replace_once(
              "                } finally {\n"
              "                    audioExecutor.shutdownNow()\n"
              "                    controlExecutor.shutdown()\n"
              "                    awaitAudioTermination()",
              "                } finally {\n"
              "                    audioExecutor.shutdownNow()\n"
              "                    pttStateMachine.shutdown()\n"
              "                    controlExecutor.shutdown()\n"
              "                    awaitAudioTermination()",
              'normal close PTT shutdown',
          )

          replace_once(
              "        } catch (_: RejectedExecutionException) {\n"
              "            audioExecutor.shutdownNow()\n"
              "            controlExecutor.shutdown()",
              "        } catch (_: RejectedExecutionException) {\n"
              "            audioExecutor.shutdownNow()\n"
              "            pttStateMachine.shutdown()\n"
              "            controlExecutor.shutdown()",
              'rejected close PTT shutdown',
          )

          sub_once(
              r"    private fun sendTracked\(role: Ic705ChannelRole, template: ByteArray\) \{.*?\n    \}\n\n(?=    private fun sendUntracked)",
              "    @Throws(IOException::class)\n"
              "    private fun sendTracked(role: Ic705ChannelRole, template: ByteArray) {\n"
              "        val runtime = channelRuntimes[role]\n"
              "            ?: throw IOException(\"$role runtime is unavailable\")\n"
              "        val channel = channels[role]\n"
              "            ?: throw IOException(\"$role UDP channel is unavailable\")\n"
              "        if (!channel.isOpen) {\n"
              "            throw IOException(\"$role UDP channel is not open\")\n"
              "        }\n"
              "        val tracked = runtime.trackedPackets.track(template)\n"
              "        try {\n"
              "            channel.send(tracked.data)\n"
              "        } catch (error: Exception) {\n"
              "            runtime.trackedPackets.discard(tracked.sequence)\n"
              "            if (error is IOException) throw error\n"
              "            throw IOException(\"$role UDP send failed\", error)\n"
              "        }\n"
              "    }\n\n",
              'strict tracked send',
          )

          sub_once(
              r"    private fun checkWatchdog\(\) \{.*?\n    \}\n\n(?=    private fun scheduleConnectionInfoSettle)",
              "    private fun checkWatchdog() {\n"
              "        val now = monotonicMillis()\n"
              "        val pttPossiblyAsserted = pttStateMachine.isTransmitting\n"
              "        val stale = channelRuntimes.values.firstOrNull { runtime ->\n"
              "            if (runtime.remoteId == null) return@firstOrNull false\n"
              "            if (\n"
              "                runtime.role == Ic705ChannelRole.AUDIO &&\n"
              "                (pttPossiblyAsserted || now < audioWatchdogGraceUntilMillis)\n"
              "            ) {\n"
              "                return@firstOrNull false\n"
              "            }\n"
              "            val timeout = ic705ChannelWatchdogTimeoutMillis(config.timing, runtime.role)\n"
              "            now - runtime.lastReceivedAtMillis.get() > timeout\n"
              "        }\n"
              "        if (stale != null) {\n"
              "            val age = (now - stale.lastReceivedAtMillis.get()).coerceAtLeast(0L)\n"
              "            val timeout = ic705ChannelWatchdogTimeoutMillis(config.timing, stale.role)\n"
              "            Log.w(\n"
              "                TAG,\n"
              "                \"watchdog stale role=${stale.role} age=${age}ms timeout=${timeout}ms \" +\n"
              "                    \"ptt=${pttStateMachine.state} phase=${engineState.phase} generation=$generation\",\n"
              "            )\n"
              "            dispatch(Ic705RxSessionEngine.Event.RecoverableFailure(\"${stale.role} timeout\"))\n"
              "        }\n"
              "    }\n\n",
              'role-aware watchdog',
          )

          replace_once(
              "internal fun shouldSendIc705TrackedIdle(\n"
              "    millisSinceLastTracked: Long,\n"
              "    idleAfterMillis: Long,\n"
              "): Boolean = millisSinceLastTracked >= idleAfterMillis\n\n"
              "private fun namedDaemonThreadFactory",
              "internal fun shouldSendIc705TrackedIdle(\n"
              "    millisSinceLastTracked: Long,\n"
              "    idleAfterMillis: Long,\n"
              "): Boolean = millisSinceLastTracked >= idleAfterMillis\n\n"
              "internal fun ic705ChannelWatchdogTimeoutMillis(\n"
              "    timing: Ic705RxSessionTiming,\n"
              "    role: Ic705ChannelRole,\n"
              "): Long = when (role) {\n"
              "    Ic705ChannelRole.CONTROL -> timing.channelTimeoutMillis\n"
              "    Ic705ChannelRole.CIV -> timing.civChannelTimeoutMillis\n"
              "    Ic705ChannelRole.AUDIO -> timing.audioChannelTimeoutMillis\n"
              "}\n\n"
              "private fun namedDaemonThreadFactory",
              'watchdog timeout helper',
          )

          path.write_text(text)
          PY

      - name: Remove one-off patch workflows
        run: rm -f .github/workflows/ic705-session-stability-fix.yml .github/workflows/ic705-session-stability-fix-v2.yml

      - name: Run IC-705 unit tests and lint
        run: ./gradlew testArm64OpenglDebugUnitTest lintArm64OpenglDebug --no-daemon --stacktrace

      - name: Commit tested patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ic705/session/Ic705RxSession.kt .github/workflows/ic705-session-stability-fix.yml .github/workflows/ic705-session-stability-fix-v2.yml
          git commit -m 'fix: harden IC-705 TX session recovery'
          git push origin HEAD:fix/ic705-session-stability
