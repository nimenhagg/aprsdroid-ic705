name: Cleanup merged branches

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete heads of merged pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --state merged \
            --limit 100 \
            --json headRefName \
            --jq '.[].headRefName' |
          sort -u |
          while IFS= read -r branch; do
            [ -z "${branch}" ] && continue
            [ "${branch}" = "main" ] && continue

            open_count="$(gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --head "${branch}" \
              --json number \
              --jq 'length')"

            if [ "${open_count}" != "0" ]; then
              echo "Skip ${branch}: an open PR still points to it"
              continue
            fi

            if gh api --silent --method GET \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting merged branch: ${branch}"
              gh api --silent --method DELETE \
                "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          done
