# Debug build ProGuard rules:
# Strips unused classes/methods (such as the ~10,000 unreferenced icons in material-icons-extended)
# while keeping all class/method names, line numbers, and debug symbols completely un-obfuscated.

-dontobfuscate
-dontoptimize
-keepattributes SourceFile,LineNumberTable,*Annotation*,EnclosingMethod,InnerClasses,Signature
-dontwarn **
