<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="160" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A202C" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="beaconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Background Container -->
  <rect width="108" height="108" rx="24" ry="24" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Radio Waves (Concentric Arcs) -->
  <g filter="url(#glow)">
    <!-- Inner Ring -->
    <path
      fill="url(#waveGrad)"
      d="M54,42 C47.4,42 42,47.4 42,54 C42,60.6 47.4,66 54,66 C60.6,66 66,60.6 66,54 C66,47.4 60.6,42 54,42 Z M54,48 C57.3,48 60,50.7 60,54 C60,57.3 57.3,60 54,60 C50.7,60 48,57.3 48,54 C48,50.7 50.7,48 54,48 Z" />

    <!-- Outer Left Wave -->
    <path
      fill="url(#waveGrad)"
      opacity="0.9"
      d="M54,30 C40.7,30 30,40.7 30,54 C30,67.3 40.7,78 54,78 L54,72 C44,72 36,64 36,54 C36,44 44,36 54,36 L54,30 Z" />

    <!-- Outer Right Wave -->
    <path
      fill="url(#waveGrad)"
      opacity="0.9"
      d="M54,30 L54,36 C64,36 72,44 72,54 C72,64 64,72 54,72 L54,78 C67.3,78 78,67.3 78,54 C78,40.7 67.3,30 54,30 Z" />

    <!-- Center Antenna Beacon Mast -->
    <path
      fill="url(#beaconGrad)"
      d="M51,51 L57,51 L57,84 L51,84 Z" />

    <!-- Top Beacon Arrow / Dot -->
    <path
      fill="#F8FAFC"
      d="M54,24 L48,30 L60,30 Z" />
  </g>
</svg>
