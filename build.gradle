// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
	repositories {
		google()
		mavenCentral()
		maven { url = uri("https://maven.aliyun.com/repository/public") }
		maven { url = uri("https://maven.aliyun.com/repository/google") }
		maven { url = uri("https://jitpack.io") }
		mavenLocal()
	}
	dependencies {
	}
}

plugins {
	// https://github.com/Triple-T/gradle-play-publisher#usage
	id("com.github.triplet.play") version "4.0.0"
	alias(libs.plugins.androidApplication)
	alias(libs.plugins.composeCompiler)
}

allprojects {
	repositories {
		google()
		mavenCentral()
		maven { url = uri("https://maven.aliyun.com/repository/public") }
		maven { url = uri("https://maven.aliyun.com/repository/google") }
		maven { url = uri("https://jitpack.io") }
		mavenLocal()
	}
}

/////////////// APRSdroid specific build rules ///////////////

def gitText = { List<String> args ->
	providers.exec {
		workingDir rootProject.projectDir
		commandLine(['git'] + args)
		ignoreExitValue = true
	}.standardOutput.asText.map { it.trim() }
}

def localSourceRevisionProvider = gitText(['rev-parse', 'HEAD']).zip(
	gitText(['status', '--porcelain', '--untracked-files=no'])
) { sha, dirty ->
	if (!sha) return 'unknown'
	return dirty ? "${sha}-dirty" : sha
}

def sourceRevisionProvider = providers.gradleProperty('SOURCE_REVISION')
	.orElse(providers.environmentVariable('GITHUB_SHA'))
	.orElse(localSourceRevisionProvider)
	.orElse('unknown')

ext {
	build_date = new Date().format('yyyy-MM-dd')
	mod_version = (findProperty("MOD_VERSION") ?: "2.0.0").toString()
	mod_version_code = Integer.parseInt((findProperty("VERSION_CODE") ?: "2026082898").toString())
	maplibre_version = "13.5.1"
	base_version = "APRSdroid v1.7.0"
	source_revision = sourceRevisionProvider.get().toString()
	build_revision = "Mod-v${mod_version}"
	build_version = "APRSdroid Mod ${mod_version} (based on ${base_version}) ${build_date}"
}

if (!(mod_version ==~ /\d+\.\d+\.\d+/)) {
	throw new GradleException("MOD_VERSION must use major.minor.patch format: ${mod_version}")
}
if (mod_version_code < 1 || mod_version_code > 2100000000) {
	throw new GradleException("VERSION_CODE must be between 1 and 2100000000: ${mod_version_code}")
}

def mapsApiKey() {
	def environmentKey = System.getenv('MAPS_API_KEY')?.trim()
	if (environmentKey) return environmentKey
	def propertyKey = findProperty('MAPS_API_KEY')?.toString()?.trim()
	if (propertyKey) return propertyKey
	Properties properties = new Properties()
	try {
		properties.load(project.rootProject.file('local.properties').newDataInputStream())
	} catch(Exception ex) {}
	properties.getProperty('mapsApiKey', '').trim()
}

def configuredMapsApiKey = mapsApiKey()

android {
	namespace = 'org.aprsdroid.app'
	compileSdk = 37
	defaultConfig {
		applicationId = "me.nimenhagg.aprsdroidic705mod"
		minSdk = 27
		targetSdk = 37
		versionName "$build_revision"
		versionCode mod_version_code
		resValue "string", "build_revision", "$build_revision"
		resValue "string", "build_version", "$build_version"
		resValue "string", "google_maps_key", configuredMapsApiKey
		buildConfigField "boolean", "GOOGLE_MAPS_ENABLED", (!configuredMapsApiKey.isEmpty()).toString()
		buildConfigField "String", "MAPLIBRE_VERSION", "\"${maplibre_version}\""
		buildConfigField "String", "SOURCE_REVISION", "\"${source_revision}\""

		testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
	buildFeatures {
		buildConfig = true
		compose = true
		resValues = true
	}
	flavorDimensions += 'target'
	productFlavors {
		arm64Vulkan {
			dimension = 'target'
			ndk { abiFilters 'arm64-v8a' }
		}
		arm64Opengl {
			dimension = 'target'
			ndk { abiFilters 'arm64-v8a' }
		}
		arm32Opengl {
			dimension = 'target'
			ndk { abiFilters 'armeabi-v7a' }
		}
		x86Multi {
			dimension = 'target'
			ndk { abiFilters 'x86' }
		}
		x8664Multi {
			dimension = 'target'
			ndk { abiFilters 'x86_64' }
		}
	}
	lint {
		abortOnError = false
		checkReleaseBuilds = false
		// These versions are intentionally pinned to the mutually compatible release toolchain.
		disable += ['AndroidGradlePluginVersion', 'NewerVersionAvailable', 'LocalContextGetResourceValueCall']
		// MapLibre brings Timber transitively; this app intentionally keeps its existing Android Log facade.
		disable += ['LogNotTimber']
	}

	buildTypes {
		debug {
			minifyEnabled = false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.cfg'
		}
		release {
			minifyEnabled = true
			shrinkResources = true
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.cfg'
		}
	}

	if (project.hasProperty("RELEASE_KEY_ALIAS")) {
		signingConfigs {
			release {
				storeFile = file(RELEASE_STORE_FILE)
				storePassword = RELEASE_STORE_PASSWORD
				keyAlias = RELEASE_KEY_ALIAS
				keyPassword = RELEASE_KEY_PASSWORD
				enableV1Signing = false
				enableV2Signing = true
				enableV3Signing = true
				enableV4Signing = true
			}
		}
		buildTypes {
			release {
				signingConfig signingConfigs.release
			}
		}
	}
	sourceSets {
		main {
			manifest.srcFile(file('AndroidManifest.xml'))
			java.srcDirs = ['src']
			kotlin.srcDirs = ['src']
			resources.srcDirs = ['src']
			res.srcDirs = ['res']
			assets.srcDirs = ['assets']
			jniLibs.srcDirs = ['libs']
		}
		androidTest {
			java.srcDirs = ['androidTest/java']
			kotlin.srcDirs = ['androidTest/java']
		}
		test {
			java.srcDirs = ['test/java']
			kotlin.srcDirs = ['test/java']
		}
	}
	lint {
		disable += ['MissingTranslation', 'InvalidPackage']
	}
	testOptions {
		unitTests {
			returnDefaultValues = true
		}
	}
}

def expectedReleaseTag = "Mod-v${mod_version}"

tasks.register('verifyReleaseVersion') {
	group = 'verification'
	description = 'Checks that a CI release tag matches the APK version metadata.'
	doLast {
		def actualTag = System.getenv('GITHUB_REF_TYPE') == 'tag'
			? System.getenv('GITHUB_REF_NAME')
			: System.getenv('RELEASE_TAG_OVERRIDE')
		if (actualTag && actualTag != expectedReleaseTag) {
			throw new GradleException("Release tag ${actualTag} does not match ${expectedReleaseTag}")
		}
	}
}

play {
	serviceAccountCredentials = file('play-publish-credentials.json')
	track = 'beta'
}

dependencies {
	implementation fileTree(include: ['*.jar'], dir: 'libs')
	arm64VulkanImplementation "org.maplibre.gl:android-sdk-vulkan:${maplibre_version}"
	arm64OpenglImplementation "org.maplibre.gl:android-sdk-opengl:${maplibre_version}"
	arm32OpenglImplementation "org.maplibre.gl:android-sdk-opengl:${maplibre_version}"
	x86MultiImplementation "org.maplibre.gl:android-sdk-vulkan-opengl:${maplibre_version}"
	x8664MultiImplementation "org.maplibre.gl:android-sdk-vulkan-opengl:${maplibre_version}"
	implementation 'com.google.android.gms:play-services-maps:20.0.0'
	implementation 'com.squareup.okhttp3:okhttp:5.3.0'
	implementation 'androidx.core:core-ktx:1.19.0'
	implementation 'com.google.android.material:material:1.14.0'

	def composeBom = platform('androidx.compose:compose-bom:2026.08.00')
	implementation composeBom
	implementation 'androidx.compose.ui:ui'
	implementation 'androidx.compose.ui:ui-graphics'
	implementation 'androidx.compose.ui:ui-tooling-preview'
	implementation 'androidx.compose.material3:material3'
	implementation 'androidx.compose.material:material-icons-extended'
	implementation 'androidx.activity:activity-compose:1.13.0'
	implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
	implementation 'androidx.navigation:navigation-compose:2.10.0'

	androidTestImplementation 'androidx.test:runner:1.7.0'
	androidTestImplementation 'androidx.test.ext:junit:1.3.0'
	androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
	testImplementation 'junit:junit:4.13.2'
}
