// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
	repositories {
		google()
		mavenCentral()
		maven { url "https://maven.aliyun.com/repository/public" }
		maven { url "https://maven.aliyun.com/repository/google" }
		maven { url "https://jitpack.io" }
		mavenLocal()
	}
	dependencies {
	}
}

plugins {
	// obtain revision from git
	id 'org.ajoberstar.grgit' version '5.3.2'
	// https://github.com/Triple-T/gradle-play-publisher#usage
	id("com.github.triplet.play") version "3.13.0"
	alias(libs.plugins.androidApplication)
	alias(libs.plugins.kotlinAndroid)
}

allprojects {
	repositories {
		google()
		mavenCentral()
		maven { url "https://maven.aliyun.com/repository/public" }
		maven { url "https://maven.aliyun.com/repository/google" }
		maven { url "https://jitpack.io" }
		mavenLocal()
	}
}

/////////////// APRSdroid specific build rules ///////////////

ext {
	build_date = new Date().format('yyyy-MM-dd')
	mod_version = (findProperty("MOD_VERSION") ?: "1.5.15").toString()
	mod_version_code = Integer.parseInt((findProperty("VERSION_CODE") ?: "2026082415").toString())
	base_version = "APRSdroid v1.7.0"
	build_revision = "${mod_version}-ic705 (based on ${base_version})"
	build_version = "APRSdroid IC-705 ${mod_version} (based on ${base_version}) ${build_date}"
}

if (!(mod_version ==~ /\d+\.\d+\.\d+/)) {
	throw new GradleException("MOD_VERSION must use major.minor.patch format: ${mod_version}")
}
if (mod_version_code < 1 || mod_version_code > 2100000000) {
	throw new GradleException("VERSION_CODE must be between 1 and 2100000000: ${mod_version_code}")
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
	kotlinOptions.jvmTarget = '17'
}

def mapsApiKey() {
	Properties properties = new Properties()
	try {
		properties.load(project.rootProject.file('local.properties').newDataInputStream())
	} catch(Exception ex) {}
	properties.getProperty('mapsApiKey', "AIzaSyA12R_iI_upYQ33FWnPU_8GlMKrEmjDxiQ")
}

android {
	namespace 'org.aprsdroid.app'
	compileSdk = 36
	defaultConfig {
		applicationId "me.nimenhagg.aprsdroidic705mod"
		minSdk = 24
		targetSdk = 36
		versionName "$build_revision"
		versionCode mod_version_code
		resValue "string", "build_revision", "$build_revision"
		resValue "string", "build_date", "$build_date"
		resValue "string", "build_version", "$build_version"
		resValue "string", "google_maps_key", mapsApiKey()

		testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
	}
	useLibrary 'org.apache.http.legacy'
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
	buildFeatures {
		buildConfig = true
		compose = true
	}
	composeOptions {
		kotlinCompilerExtensionVersion = "1.5.14"
	}

	buildTypes {
		debug {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard.cfg'
		}
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard.cfg'
		}
	}

	if (project.hasProperty("RELEASE_KEY_ALIAS")) {
		signingConfigs {
			release {
				storeFile file(RELEASE_STORE_FILE)
				storePassword RELEASE_STORE_PASSWORD
				keyAlias RELEASE_KEY_ALIAS
				keyPassword RELEASE_KEY_PASSWORD
				v1SigningEnabled = true
				v2SigningEnabled = true
				enableV1Signing = true
				enableV2Signing = true
				enableV3Signing = true
			}
		}
		buildTypes {
			release {
				signingConfig signingConfigs.release
			}
		}
	}
	sourceSets {
		main {
			manifest.srcFile 'AndroidManifest.xml'
			java.srcDirs = ['src']
			resources.srcDirs = ['src']
			aidl.srcDirs = ['src']
			renderscript.srcDirs = ['src']
			res.srcDirs = ['res']
			assets.srcDirs = ['assets']
			jniLibs.srcDirs = ['libs']
		}
		androidTest {
			java.srcDirs = ['androidTest/java']
		}
		test {
			java.srcDirs = ['test/java']
		}
	}
	lintOptions {
		disable 'MissingTranslation'
		disable 'InvalidPackage'
	}
	testOptions {
		unitTests {
			returnDefaultValues = true
		}
	}
}

tasks.register('verifyReleaseVersion') {
	group = 'verification'
	description = 'Checks that a CI release tag matches the APK version metadata.'
	doLast {
		if (System.getenv('GITHUB_REF_TYPE') == 'tag') {
			def actualTag = System.getenv('GITHUB_REF_NAME')
			def expectedTag = "v${mod_version}-ic705"
			if (actualTag != expectedTag) {
				throw new GradleException("Release tag ${actualTag} does not match ${expectedTag}")
			}
		}
	}
}

play {
	serviceAccountCredentials = file('play-publish-credentials.json')
	track = 'beta'
}

dependencies {
	implementation fileTree(include: ['*.jar'], dir: 'libs')
	implementation 'com.google.android.gms:play-services-maps:17.0.0'
	implementation 'com.google.maps.android:android-maps-utils:0.5'
	implementation 'androidx.core:core:1.12.0'
	implementation 'androidx.appcompat:appcompat:1.6.1'
	implementation 'androidx.preference:preference-ktx:1.2.1'
	implementation 'com.google.android.material:material:1.11.0'

	def composeBom = platform('androidx.compose:compose-bom:2024.05.00')
	implementation composeBom
	implementation 'androidx.compose.ui:ui'
	implementation 'androidx.compose.ui:ui-graphics'
	implementation 'androidx.compose.ui:ui-tooling-preview'
	implementation 'androidx.compose.material3:material3'
	implementation 'androidx.compose.material:material-icons-extended'
	implementation 'androidx.activity:activity-compose:1.8.2'
	implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
	implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'

	androidTestImplementation 'com.android.support.test:runner:1.0.2'
	androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
	testImplementation 'junit:junit:4.13.2'
}
