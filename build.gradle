// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
	repositories {
		google()
		mavenCentral()
		maven { url = uri("https://maven.aliyun.com/repository/public") }
		maven { url = uri("https://maven.aliyun.com/repository/google") }
		maven { url = uri("https://jitpack.io") }
		mavenLocal()
	}
	dependencies {
	}
}

plugins {
	// https://github.com/Triple-T/gradle-play-publisher#usage
	id("com.github.triplet.play") version "4.0.0"
	alias(libs.plugins.androidApplication)
	alias(libs.plugins.composeCompiler)
}

allprojects {
	repositories {
		google()
		mavenCentral()
		maven { url = uri("https://maven.aliyun.com/repository/public") }
		maven { url = uri("https://maven.aliyun.com/repository/google") }
		maven { url = uri("https://jitpack.io") }
		mavenLocal()
	}
}

/////////////// APRSdroid specific build rules ///////////////

ext {
	build_date = new Date().format('yyyy-MM-dd')
	mod_version = (findProperty("MOD_VERSION") ?: "1.6.2").toString()
	mod_version_code = Integer.parseInt((findProperty("VERSION_CODE") ?: "2026082462").toString())
	base_version = "APRSdroid v1.7.0"
	build_revision = "${mod_version}-ic705 (based on ${base_version})"
	build_version = "APRSdroid IC-705 ${mod_version} (based on ${base_version}) ${build_date}"
}

if (!(mod_version ==~ /\d+\.\d+\.\d+/)) {
	throw new GradleException("MOD_VERSION must use major.minor.patch format: ${mod_version}")
}
if (mod_version_code < 1 || mod_version_code > 2100000000) {
	throw new GradleException("VERSION_CODE must be between 1 and 2100000000: ${mod_version_code}")
}

def mapsApiKey() {
	Properties properties = new Properties()
	try {
		properties.load(project.rootProject.file('local.properties').newDataInputStream())
	} catch(Exception ex) {}
	properties.getProperty('mapsApiKey', "AIzaSyA12R_iI_upYQ33FWnPU_8GlMKrEmjDxiQ")
}

android {
	namespace = 'org.aprsdroid.app'
	compileSdk = 37
	defaultConfig {
		applicationId = "me.nimenhagg.aprsdroidic705mod"
		minSdk = 24
		targetSdk = 37
		versionName "$build_revision"
		versionCode mod_version_code
		resValue "string", "build_revision", "$build_revision"
		resValue "string", "build_date", "$build_date"
		resValue "string", "build_version", "$build_version"
		resValue "string", "google_maps_key", mapsApiKey()

		testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
	buildFeatures {
		buildConfig = true
		compose = true
		resValues = true
	}

	buildTypes {
		debug {
			minifyEnabled = false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.cfg'
		}
		release {
			minifyEnabled = false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.cfg'
		}
	}

	if (project.hasProperty("RELEASE_KEY_ALIAS")) {
		signingConfigs {
			release {
				storeFile = file(RELEASE_STORE_FILE)
				storePassword = RELEASE_STORE_PASSWORD
				keyAlias = RELEASE_KEY_ALIAS
				keyPassword = RELEASE_KEY_PASSWORD
				enableV1Signing = true
				enableV2Signing = true
				enableV3Signing = true
			}
		}
		buildTypes {
			release {
				signingConfig signingConfigs.release
			}
		}
	}
	sourceSets {
		main {
			manifest.srcFile(file('AndroidManifest.xml'))
			java.srcDirs = ['src']
			kotlin.srcDirs = ['src']
			resources.srcDirs = ['src']
			res.srcDirs = ['res']
			assets.srcDirs = ['assets']
			jniLibs.srcDirs = ['libs']
		}
		androidTest {
			java.srcDirs = ['androidTest/java']
			kotlin.srcDirs = ['androidTest/java']
		}
		test {
			java.srcDirs = ['test/java']
			kotlin.srcDirs = ['test/java']
		}
	}
	lint {
		disable += ['MissingTranslation', 'InvalidPackage']
	}
	testOptions {
		unitTests {
			returnDefaultValues = true
		}
	}
}

tasks.register('verifyReleaseVersion') {
	group = 'verification'
	description = 'Checks that a CI release tag matches the APK version metadata.'
	doLast {
		if (System.getenv('GITHUB_REF_TYPE') == 'tag') {
			def actualTag = System.getenv('GITHUB_REF_NAME')
			def expectedTag = "v${mod_version}-ic705"
			if (actualTag != expectedTag) {
				throw new GradleException("Release tag ${actualTag} does not match ${expectedTag}")
			}
		}
	}
}

play {
	serviceAccountCredentials = file('play-publish-credentials.json')
	track = 'beta'
}

dependencies {
	implementation fileTree(include: ['*.jar'], dir: 'libs')
	implementation 'com.google.android.gms:play-services-maps:17.0.0'
	implementation 'com.google.maps.android:android-maps-utils:0.5'
	implementation 'androidx.core:core:1.12.0'
	implementation 'androidx.appcompat:appcompat:1.6.1'
	implementation 'androidx.preference:preference-ktx:1.2.1'
	implementation 'com.google.android.material:material:1.11.0'

	def composeBom = platform('androidx.compose:compose-bom:2026.08.00')
	implementation composeBom
	implementation 'androidx.compose.ui:ui'
	implementation 'androidx.compose.ui:ui-graphics'
	implementation 'androidx.compose.ui:ui-tooling-preview'
	implementation 'androidx.compose.material3:material3'
	implementation 'androidx.compose.material:material-icons-extended'
	implementation 'androidx.activity:activity-compose:1.13.0'
	implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
	implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'

	androidTestImplementation 'androidx.test:runner:1.7.0'
	androidTestImplementation 'androidx.test.ext:junit:1.3.0'
	androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
	testImplementation 'junit:junit:4.13.2'
}
